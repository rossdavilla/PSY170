<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Subtext</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one-screen script page. Brand + progress on top, the line and its parenthetical in the middle, actions pinned at the bottom. */
:root {
  --paper: #F2F3F8;
  --card: #FFFFFF;
  --ink: #191C2C;
  --muted: #5B6077;
  --line: #D8DBE7;
  --accent: #B8174F;
  --accent-ink: #FFFFFF;
  --hi: #FFE26A;
  --hi-ink: #191C2C;
  --yes: #1C7A52;
  --no: #B0281F;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --script: "Courier Prime", "Courier New", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #13151E; --card: #1D2030; --ink: #ECEEF6; --muted: #A2A7BD; --line: #30344A;
    --accent: #F0619A; --accent-ink: #13151E; --hi: #F4D445; --hi-ink: #13151E; --yes: #4DC38C; --no: #F27A70;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #13151E; --card: #1D2030; --ink: #ECEEF6; --muted: #A2A7BD; --line: #30344A;
  --accent: #F0619A; --accent-ink: #13151E; --hi: #F4D445; --hi-ink: #13151E; --yes: #4DC38C; --no: #F27A70;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: clamp(14px, min(2.6vw, 3.8vh), 17px);
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
}
.app {
  height: 100%;
  max-width: 660px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  padding-block: clamp(10px, 3vh, 18px);
  gap: clamp(8px, 2.5vh, 16px);
}

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 28px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.05em; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 2px; }
.brand span { color: var(--accent); }
.bar-right { display: flex; align-items: center; gap: 14px; }
.dots { display: flex; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line); background: transparent; }
.dot.current { border-color: var(--accent); }
.dot.yes { background: var(--yes); border-color: var(--yes); }
.dot.no { background: var(--no); border-color: var(--no); }
.restart {
  font: 700 0.72em/1 var(--script); text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--muted); background: none; border: 0; padding: 6px 2px; cursor: pointer;
}
.restart:hover { color: var(--ink); }

/* stage */
main { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: clamp(8px, 2.4vh, 16px); }
.enter { animation: rise 220ms ease-out; }
@keyframes rise { from { opacity: 0.001; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.eyebrow { font: 700 0.75em/1.2 var(--script); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.eyebrow b { color: var(--accent); font-weight: 700; }
h1, h2 { font-family: var(--display); font-weight: 800; letter-spacing: -0.02em; line-height: 1.02; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(30px, min(8vw, 12vh), 58px); }
h2 { font-size: clamp(24px, min(6vw, 9vh), 42px); }
p { margin: 0; max-width: 56ch; text-wrap: pretty; }
.lede { font-size: 1.12em; color: var(--ink); }
.muted { color: var(--muted); }

/* the line + parenthetical, screenplay style */
.line {
  font-family: var(--display); font-weight: 800; letter-spacing: -0.025em; line-height: 1.02;
  font-size: clamp(32px, min(8.5vw, 12.5vh), 62px); margin: 0; text-wrap: balance;
}
.line .q { color: var(--accent); }
.paren-label { font: 700 0.72em/1 var(--script); text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-top: 0.4em; }
.paren {
  font-family: var(--script); font-style: italic; font-size: clamp(18px, min(4vw, 6vh), 28px); line-height: 1.25;
  align-self: flex-start;
}
.paren mark {
  background: var(--hi); color: var(--hi-ink); padding: 0.05em 0.3em;
  box-decoration-break: clone; -webkit-box-decoration-break: clone;
  border-radius: 2px;
}
.rule { font-size: 0.9em; color: var(--muted); }

/* footer actions */
footer { display: flex; flex-direction: column; gap: 10px; }
.ask { font-weight: 700; font-size: 1em; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
button.btn {
  font: 700 1.02em/1 var(--body); cursor: pointer;
  min-height: 46px; padding: 0 26px; border-radius: 999px;
  border: 2px solid transparent; transition: transform 80ms ease, filter 120ms ease;
}
button.btn:active { transform: scale(0.97); }
.primary { background: var(--accent); color: var(--accent-ink); }
.primary:hover { filter: brightness(1.08); }
.choice { flex: 1 1 120px; background: var(--card); color: var(--ink); border-color: var(--line); }
.choice.yes:hover { border-color: var(--yes); color: var(--yes); }
.choice.no:hover { border-color: var(--no); color: var(--no); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* hand-off */
.handoff { display: flex; align-items: center; gap: clamp(12px, 3vw, 22px); }
.handoff svg { flex: none; width: clamp(44px, 11vh, 64px); height: auto; }
.handoff svg path { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.handoff svg rect { fill: var(--card); stroke: var(--ink); stroke-width: 2.5; }

/* tally */
.score { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.score .big { font-family: var(--display); font-weight: 800; font-size: clamp(34px, min(8vw, 12vh), 56px); line-height: 1; font-variant-numeric: tabular-nums; }
.score .big small { font-size: 0.5em; color: var(--muted); }
.rows { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 4px 14px;
  padding: clamp(5px, 1.4vh, 9px) 0; border-bottom: 1px solid var(--line);
}
.row .say { font-family: var(--display); font-weight: 600; font-size: 1.05em; line-height: 1.15; min-width: 0; }
.row .meaning { font-family: var(--script); font-style: italic; font-size: 0.86em; color: var(--muted); display: block; }
.row .who { font: 700 0.7em/1 var(--script); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); white-space: nowrap; }
.pill { font: 700 0.78em/1 var(--body); padding: 6px 10px; border-radius: 999px; border: 2px solid currentColor; white-space: nowrap; }
.pill.yes { color: var(--yes); }
.pill.no { color: var(--no); }

@media (max-width: 460px) {
  .row { grid-template-columns: minmax(0, 1fr) auto; }
  .row .who { grid-column: 1; grid-row: 2; }
  .row .pill { grid-column: 2; grid-row: 1 / span 2; }
}
@media (prefers-reduced-motion: reduce) {
  .enter { animation: none; }
  button.btn { transition: none; }
}
</style>
</head><body>

<div class="app">
  <header class="bar">
    <div class="brand" aria-label="Subtext">Subtext<span>.</span></div>
    <div class="bar-right">
      <div class="dots" id="dots" aria-hidden="true"></div>
      <button class="restart" id="restart" type="button" hidden>Start over</button>
    </div>
  </header>
  <main id="stage" aria-live="polite"></main>
  <footer id="actions"></footer>
</div>

<script>
const PHRASES = [
  { text: "Sure, we can do that.", meanings: ["enthusiastic", "doubts it will work", "sarcastic, insulting"] },
  { text: "Good job.", meanings: ["sincere praise", "sarcastic", "surprised you pulled it off"] },
  { text: "No, it’s okay.", meanings: ["clearly not okay", "politely declining an offer", "reassuring someone upset"] }
];
const STEPS = ["intro", "ready", "phrase", "switch", "ready", "phrase", "switch", "ready", "phrase", "tally"];

const stage = document.getElementById("stage");
const actions = document.getElementById("actions");
const dots = document.getElementById("dots");
const restartBtn = document.getElementById("restart");

let step = 0;
let rounds = [];

function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function newGame() {
  rounds = shuffle(PHRASES).map((p, i) => ({ text: p.text, meaning: pick(p.meanings), speaker: i % 2 === 0 ? 1 : 2, result: null }));
  step = 0;
  render();
}
function roundIndex() {
  // which phrase (0-2) the current step belongs to
  return STEPS.slice(0, step + 1).filter(s => s === "ready").length - 1;
}
function esc(s) { return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function quoteLine(t) { return `<span class="q">“</span>${esc(t)}<span class="q">”</span>`; }
function next() { step = Math.min(step + 1, STEPS.length - 1); render(); }

function renderDots() {
  const kind = STEPS[step];
  if (kind === "intro") { dots.innerHTML = ""; return; }
  const ri = kind === "tally" ? -1 : roundIndex();
  dots.innerHTML = rounds.map((r, i) => {
    const cls = r.result === true ? "yes" : r.result === false ? "no" : (i === ri ? "current" : "");
    return `<span class="dot ${cls}"></span>`;
  }).join("");
}

function render() {
  const kind = STEPS[step];
  const ri = roundIndex();
  const r = rounds[ri];
  restartBtn.hidden = kind === "intro" || kind === "tally";
  renderDots();

  if (kind === "intro") {
    stage.innerHTML = `
      <div class="eyebrow">Nonverbal communication game</div>
      <h1>Say one thing. Mean another.</h1>
      <p class="lede">Let’s test your nonverbal skills. You’ll receive a phrase and its hidden meaning. Your job is to convey the hidden meaning behind the phrase using nonverbal behavior.</p>`;
    actions.innerHTML = `<div class="btns"><button class="btn primary" id="btn-next" type="button">Next</button></div>`;
  }

  if (kind === "ready") {
    const ordinal = ri === 0 ? "first" : "next";
    stage.innerHTML = `
      <div class="eyebrow">Phrase ${ri + 1} of 3 · <b>Partner ${r.speaker}</b> speaking</div>
      <h1>Ready?</h1>
      <p class="lede">Click next to get your ${ordinal} phrase.</p>
      <p class="rule">Keep the screen turned away from your listener.</p>`;
    actions.innerHTML = `<div class="btns"><button class="btn primary" id="btn-next" type="button">Next</button></div>`;
  }

  if (kind === "phrase") {
    stage.innerHTML = `
      <div class="eyebrow">Phrase ${ri + 1} of 3 · <b>Partner ${r.speaker}</b> speaking</div>
      <p class="line">${quoteLine(r.text)}</p>
      <div>
        <div class="paren-label">Your hidden meaning</div>
        <div class="paren"><mark>(${esc(r.meaning)})</mark></div>
      </div>`;
    actions.innerHTML = `
      <div class="ask" id="ask">Did the listener guess your hidden meaning correctly?</div>
      <div class="btns" role="group" aria-labelledby="ask">
        <button class="btn choice yes" id="btn-yes" type="button">Yes</button>
        <button class="btn choice no" id="btn-no" type="button">No</button>
      </div>`;
  }

  if (kind === "switch") {
    stage.innerHTML = `
      <div class="handoff">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <rect x="22" y="10" width="20" height="34" rx="4"></rect>
          <path d="M8 52 C 20 60, 44 60, 56 52"></path>
          <path d="M49 47 L56 52 L49 57"></path>
        </svg>
        <h2>Now let your partner have a turn.</h2>
      </div>
      <p class="lede">Give them the phone and they can reveal the next phrase.</p>`;
    actions.innerHTML = `<div class="btns"><button class="btn primary" id="btn-next" type="button">Next</button></div>`;
  }

  if (kind === "tally") {
    const hits = rounds.filter(x => x.result).length;
    stage.innerHTML = `
      <div class="score">
        <div class="big">${hits}<small> / 3</small></div>
        <div class="eyebrow">hidden meanings decoded</div>
      </div>
      <div class="rows">
        ${rounds.map(x => `
          <div class="row">
            <div class="say">${quoteLine(x.text)}<span class="meaning">(${esc(x.meaning)})</span></div>
            <div class="who">Partner ${x.speaker}</div>
            <div class="pill ${x.result ? "yes" : "no"}">${x.result ? "Decoded" : "Missed"}</div>
          </div>`).join("")}
      </div>`;
    actions.innerHTML = `<div class="btns"><button class="btn primary" id="btn-again" type="button">Play again</button></div>`;
  }

  stage.classList.remove("enter"); void stage.offsetWidth; stage.classList.add("enter");
  const first = actions.querySelector("button");
  if (first && document.activeElement && document.activeElement !== document.body) first.focus({ preventScroll: true });
}

actions.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.id === "btn-next") next();
  if (b.id === "btn-yes" || b.id === "btn-no") { rounds[roundIndex()].result = b.id === "btn-yes"; next(); }
  if (b.id === "btn-again") newGame();
});
restartBtn.addEventListener("click", newGame);

newGame();
</script>
</body></html>
