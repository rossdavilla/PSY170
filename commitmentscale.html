<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commitment to UC Merced</title>
<style>
  :root {
    color-scheme: light;
    --page: #eef0f4;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --muted: #52514e;
    --line: rgba(11, 11, 11, 0.12);
    --soft: rgba(11, 11, 11, 0.05);
    --accent: #2a78d6;
    --accent-ink: #ffffff;
    --accent-soft: rgba(42, 120, 214, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0f0f0e;
      --surface: #1a1a19;
      --ink: #ffffff;
      --muted: #c3c2b7;
      --line: rgba(255, 255, 255, 0.14);
      --soft: rgba(255, 255, 255, 0.06);
      --accent: #3987e5;
      --accent-soft: rgba(57, 135, 229, 0.28);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0f0f0e;
    --surface: #1a1a19;
    --ink: #ffffff;
    --muted: #c3c2b7;
    --line: rgba(255, 255, 255, 0.14);
    --soft: rgba(255, 255, 255, 0.06);
    --accent: #3987e5;
    --accent-soft: rgba(57, 135, 229, 0.28);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* Fixed 720x450 stage, scaled to fit whatever frame it's placed in */
  #stage {
    position: absolute;
    left: 50%; top: 50%;
    width: 720px; height: 450px;
    transform-origin: center center;
    background: var(--surface);
    overflow: hidden;
  }

  .screen {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    padding: 28px 40px;
  }
  .screen.active { display: flex; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .primary {
    background: var(--accent); color: var(--accent-ink);
    font-size: 26px; font-weight: 600;
    min-width: 240px; height: 76px; border-radius: 16px;
    transition: transform .1s ease, filter .15s ease;
  }
  .primary:hover { filter: brightness(1.08); }
  .primary:active { transform: scale(.97); }

  /* Start */
  #start { align-items: center; justify-content: center; gap: 18px; text-align: center; }
  #start h1 { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  #start p { font-size: 20px; color: var(--muted); margin-bottom: 22px; }

  /* Items */
  #item { padding-top: 20px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; height: 48px; }
  .back {
    height: 48px; padding: 0 18px 0 12px; border-radius: 12px;
    font-size: 18px; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .back:hover { background: var(--soft); }
  .back[hidden] { visibility: hidden; display: flex; }
  .count { font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .progress { height: 6px; border-radius: 3px; background: var(--soft); margin-top: 10px; overflow: hidden; }
  .progress div { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .3s ease; }

  .prompt {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    font-size: 28px; line-height: 1.3; font-weight: 500;
    padding: 0 10px;
    text-wrap: balance;
  }

  .scale { display: flex; justify-content: center; gap: 12px; }
  .opt {
    width: 78px; height: 84px; border-radius: 16px;
    border: 2px solid var(--line);
    background: var(--surface);
    font-size: 32px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    transition: background .12s ease, border-color .12s ease, transform .1s ease;
  }
  .opt:hover { border-color: var(--accent); background: var(--accent-soft); }
  .opt:active { transform: scale(.95); }
  .opt.chosen { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .anchors {
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    width: 618px; margin: 10px auto 0;
    font-size: 17px; color: var(--muted);
  }
  .anchors span:nth-child(2) { text-align: center; }
  .anchors span:nth-child(3) { text-align: right; }

  /* Results */
  #results { padding: 26px 40px 24px; }
  #results h2 { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; text-align: center; }
  .res-body { flex: 1; display: flex; align-items: center; gap: 36px; }
  .overall {
    flex: 0 0 210px; height: 220px; border-radius: 20px;
    background: var(--accent); color: var(--accent-ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    text-align: center;
  }
  .overall .label { font-size: 20px; font-weight: 600; line-height: 1.2; }
  .overall .big { font-size: 76px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .overall .of { font-size: 18px; opacity: .85; }
  .dims { flex: 1; display: flex; flex-direction: column; gap: 22px; }
  .dim .row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .dim .name { font-size: 22px; font-weight: 600; }
  .dim .val { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .dim .val small { font-size: 16px; font-weight: 500; color: var(--muted); }
  .track { height: 14px; border-radius: 7px; background: var(--soft); overflow: hidden; }
  .fill { height: 100%; width: 0; border-radius: 7px; background: var(--accent); transition: width .7s cubic-bezier(.2,.8,.2,1); }
  .res-foot { display: flex; justify-content: center; }
  .res-foot .primary { height: 58px; font-size: 22px; min-width: 200px; }

  @media (prefers-reduced-motion: reduce) {
    .screen.active { animation: none; }
    .fill { transition: none; }
  }
</style>
</head>
<body>
<div id="stage">

  <section id="start" class="screen active">
    <h1>Commitment to UC Merced</h1>
    <p>12 statements &middot; rate how much you agree with each</p>
    <button class="primary" id="startBtn">Start</button>
  </section>

  <section id="item" class="screen">
    <div class="topbar">
      <button class="back" id="backBtn" aria-label="Previous item">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </button>
      <span class="count" id="count">1 / 12</span>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <p class="prompt" id="prompt" aria-live="polite"></p>
    <div class="scale" id="scale" role="group" aria-label="Rating from 1 (strongly disagree) to 7 (strongly agree)"></div>
    <div class="anchors"><span>Strongly disagree</span><span>Neutral</span><span>Strongly agree</span></div>
  </section>

  <section id="results" class="screen">
    <h2>Your Commitment to UC Merced</h2>
    <div class="res-body">
      <div class="overall">
        <span class="label">Overall<br>Commitment</span>
        <span class="big" id="overall">0</span>
        <span class="of">out of 10</span>
      </div>
      <div class="dims" id="dims"></div>
    </div>
    <div class="res-foot"><button class="primary" id="retakeBtn">Retake</button></div>
  </section>

</div>

<script>
  // UC Merced-specific items based on Meyer & Allen's (1997) Three-Component Model of commitment.
  // dim: A = Affective, C = Continuance, N = Normative. rev = reverse-scored.
  var ITEMS = [
    { t: "I feel proud to wear UC Merced gear in my hometown.", dim: "A" },
    { t: "I’m happy to stay at UC Merced until I graduate.", dim: "C" },
    { t: "I care about UC Merced’s mission to bring research and scholarship to the Central Valley of California.", dim: "N" },
    { t: "Coming back to campus after a break feels like coming home.", dim: "A" },
    { t: "I’m planning to transfer to another university before I graduate.", dim: "C", rev: true },
    { t: "I’m proud to be at UC Merced because they support so many first-generation college students.", dim: "N" },
    { t: "I feel a real connection to other Bobcats, even ones I don’t know well.", dim: "A" },
    { t: "If another school offered me a spot tomorrow, I’d leave without much thought.", dim: "C", rev: true },
    { t: "I support UC Merced’s sustainability goals, like zero waste and net-zero energy.", dim: "N" },
    { t: "I still think of UC Merced as my “backup school.”", dim: "A", rev: true },
    { t: "I’ve built too much at UC Merced (friends, clubs, housing) for me to want to start over at another university.", dim: "C" },
    { t: "I go to campus events like club fairs, sports games, and Bobcat Day to be part of campus life.", dim: "N" }
  ];
  var DIMS = [
    { key: "A", name: "Affective" },
    { key: "C", name: "Continuance" },
    { key: "N", name: "Normative" }
  ];
  var POINTS = 7;

  var answers = new Array(ITEMS.length).fill(null);
  var idx = 0;
  var locked = false;

  var $ = function (id) { return document.getElementById(id); };

  function show(id) {
    document.querySelectorAll(".screen").forEach(function (s) { s.classList.remove("active"); });
    $(id).classList.add("active");
  }

  // Build the 1-7 buttons once
  for (var v = 1; v <= POINTS; v++) {
    var b = document.createElement("button");
    b.className = "opt";
    b.textContent = v;
    b.dataset.v = v;
    b.addEventListener("click", function () { choose(+this.dataset.v); });
    $("scale").appendChild(b);
  }

  function renderItem() {
    $("prompt").textContent = ITEMS[idx].t;
    $("count").textContent = (idx + 1) + " / " + ITEMS.length;
    $("bar").style.width = (idx / ITEMS.length * 100) + "%";
    $("backBtn").hidden = idx === 0;
    document.querySelectorAll(".opt").forEach(function (o) {
      o.classList.toggle("chosen", +o.dataset.v === answers[idx]);
    });
    show("item");
  }

  function choose(v) {
    if (locked) return;
    locked = true;
    answers[idx] = v;
    document.querySelectorAll(".opt").forEach(function (o) {
      o.classList.toggle("chosen", +o.dataset.v === v);
    });
    $("bar").style.width = ((idx + 1) / ITEMS.length * 100) + "%";
    setTimeout(function () {
      locked = false;
      if (idx < ITEMS.length - 1) { idx++; renderItem(); }
      else { renderResults(); }
    }, 220);
  }

  // Each dimension: mean of its items (1-7), mapped linearly to 1-10.
  // Overall: average of the three dimension scores.
  function scores() {
    var sums = { A: 0, C: 0, N: 0 }, ns = { A: 0, C: 0, N: 0 };
    ITEMS.forEach(function (it, i) {
      sums[it.dim] += it.rev ? POINTS + 1 - answers[i] : answers[i];
      ns[it.dim]++;
    });
    var out = {}, total = 0;
    DIMS.forEach(function (d) {
      var mean = sums[d.key] / ns[d.key];
      out[d.key] = 1 + (mean - 1) * 9 / (POINTS - 1);
      total += out[d.key];
    });
    out.overall = total / DIMS.length;
    return out;
  }

  function fmt(x) { return String(Math.round(x)); }

  function renderResults() {
    var s = scores();
    $("overall").textContent = fmt(s.overall);
    $("dims").innerHTML = DIMS.map(function (d) {
      return '<div class="dim"><div class="row"><span class="name">' + d.name + '</span>' +
             '<span class="val">' + fmt(s[d.key]) + ' <small>/ 10</small></span></div>' +
             '<div class="track"><div class="fill" data-w="' + (Math.round(s[d.key]) * 10) + '"></div></div></div>';
    }).join("");
    show("results");
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        document.querySelectorAll(".fill").forEach(function (f) { f.style.width = f.dataset.w + "%"; });
      });
    });
  }

  $("startBtn").addEventListener("click", function () { idx = 0; renderItem(); });
  $("backBtn").addEventListener("click", function () { if (idx > 0 && !locked) { idx--; renderItem(); } });
  $("retakeBtn").addEventListener("click", function () {
    answers.fill(null); idx = 0; show("start");
  });

  // Keyboard: 1-7 to answer, Backspace / left arrow to go back
  document.addEventListener("keydown", function (e) {
    if (!$("item").classList.contains("active")) return;
    if (e.key >= "1" && e.key <= String(POINTS)) choose(+e.key);
    else if ((e.key === "Backspace" || e.key === "ArrowLeft") && idx > 0 && !locked) { idx--; renderItem(); }
  });

  function fit() {
    var d = document.documentElement;
    var sc = Math.min(d.clientWidth / 720, d.clientHeight / 450);
    $("stage").style.transform = "translate(-50%, -50%) scale(" + sc + ")";
  }
  window.addEventListener("resize", fit);
  fit();
</script>
</body>
</html>
