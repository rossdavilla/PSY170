<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achievement Motivation Scale</title>
<style>
  :root {
    color-scheme: light;
    --page: #eef0f4;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --muted: #52514e;
    --line: rgba(11, 11, 11, 0.12);
    --soft: rgba(11, 11, 11, 0.05);
    --accent: #2a78d6;
    --accent-ink: #ffffff;
    --accent-soft: rgba(42, 120, 214, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0f0f0e;
      --surface: #1a1a19;
      --ink: #ffffff;
      --muted: #c3c2b7;
      --line: rgba(255, 255, 255, 0.14);
      --soft: rgba(255, 255, 255, 0.06);
      --accent: #3987e5;
      --accent-soft: rgba(57, 135, 229, 0.28);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0f0f0e;
    --surface: #1a1a19;
    --ink: #ffffff;
    --muted: #c3c2b7;
    --line: rgba(255, 255, 255, 0.14);
    --soft: rgba(255, 255, 255, 0.06);
    --accent: #3987e5;
    --accent-soft: rgba(57, 135, 229, 0.28);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* Fixed 720x450 stage, scaled to fit whatever frame it's placed in */
  #stage {
    position: absolute;
    left: 50%; top: 50%;
    width: 720px; height: 450px;
    transform-origin: center center;
    background: var(--surface);
    overflow: hidden;
  }

  .screen {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    padding: 28px 40px;
  }
  .screen.active { display: flex; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .primary {
    background: var(--accent); color: var(--accent-ink);
    font-size: 26px; font-weight: 600;
    min-width: 240px; height: 76px; border-radius: 16px;
    transition: transform .1s ease, filter .15s ease;
  }
  .primary:hover { filter: brightness(1.08); }
  .primary:active { transform: scale(.97); }

  /* Start */
  #start { align-items: center; justify-content: center; gap: 18px; text-align: center; }
  #start h1 { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  #start p { font-size: 20px; color: var(--muted); margin-bottom: 22px; }

  /* Items */
  #item { padding-top: 20px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; height: 48px; }
  .back {
    height: 48px; padding: 0 18px 0 12px; border-radius: 12px;
    font-size: 18px; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .back:hover { background: var(--soft); }
  .back[hidden] { visibility: hidden; display: flex; }
  .count { font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .progress { height: 6px; border-radius: 3px; background: var(--soft); margin-top: 10px; overflow: hidden; }
  .progress div { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .3s ease; }

  .prompt {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    font-size: 28px; line-height: 1.3; font-weight: 500;
    padding: 0 10px;
    text-wrap: balance;
  }

  .scale { display: flex; justify-content: center; gap: 14px; }
  .opt {
    width: 112px; height: 96px; border-radius: 18px;
    border: 2px solid var(--line);
    background: var(--surface);
    font-size: 36px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    transition: background .12s ease, border-color .12s ease, transform .1s ease;
  }
  .opt:hover { border-color: var(--accent); background: var(--accent-soft); }
  .opt:active { transform: scale(.95); }
  .opt.chosen { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .anchors {
    display: flex; justify-content: space-between;
    width: 616px; margin: 10px auto 0;
    font-size: 17px; color: var(--muted);
  }

  /* Results */
  #results { padding: 24px 40px 24px; }
  #results h2 { font-size: 30px; font-weight: 700; letter-spacing: -0.01em; text-align: center; }
  .res-body { flex: 1; display: flex; align-items: center; gap: 24px; }
  .scores { flex: 0 0 290px; display: flex; flex-direction: column; gap: 14px; }
  .score {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 12px 18px; border-radius: 14px; background: var(--soft);
  }
  .score .name { font-size: 22px; font-weight: 500; }
  .score .val { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .score .val small { font-size: 18px; font-weight: 500; color: var(--muted); }
  .chart { flex: 1; height: 100%; display: flex; align-items: center; justify-content: center; }
  .chart svg { width: 100%; height: 100%; max-height: 300px; overflow: visible; }
  .ring { fill: none; stroke: var(--line); stroke-width: 1; }
  .ring.outer { stroke-width: 1.5; }
  .spoke { stroke: var(--line); stroke-width: 1; }
  .ax-label { fill: var(--ink); font-size: 17px; font-weight: 600; }
  .shape { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
  .dot { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
  .grow { transform-box: view-box; transform-origin: 180px 170px; animation: grow .6s cubic-bezier(.2,.8,.2,1); }
  @keyframes grow { from { transform: scale(0); } to { transform: scale(1); } }
  .res-foot { display: flex; justify-content: center; }
  .res-foot .primary { height: 58px; font-size: 22px; min-width: 200px; }

  @media (prefers-reduced-motion: reduce) {
    .screen.active, .grow { animation: none; }
  }
</style>
</head>
<body>
<div id="stage">

  <section id="start" class="screen active">
    <h1>Achievement Motivation Scale</h1>
    <p>15 items &middot; rate each 1&ndash;5</p>
    <button class="primary" id="startBtn">Start</button>
  </section>

  <section id="item" class="screen">
    <div class="topbar">
      <button class="back" id="backBtn" aria-label="Previous item">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </button>
      <span class="count" id="count">1 / 15</span>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <p class="prompt" id="prompt" aria-live="polite"></p>
    <div class="scale" id="scale" role="group" aria-label="Rating from 1 (not at all) to 5 (very much so)"></div>
    <div class="anchors"><span>Not at all</span><span>Very much so</span></div>
  </section>

  <section id="results" class="screen">
    <h2>Your Needs Profile</h2>
    <div class="res-body">
      <div class="scores" id="scores"></div>
      <div class="chart" id="chart"></div>
    </div>
    <div class="res-foot"><button class="primary" id="retakeBtn">Retake</button></div>
  </section>

</div>

<script>
  // need: A = Achievement, P = Power, F = Affiliation. rev = reverse-scored.
  var ITEMS = [
    { t: "I ask others for advice even if I think I know the answer, because it is always better to be safe than sorry.", need: "A", rev: true },
    { t: "I would much rather be the boss at a company than have someone boss me around.", need: "P" },
    { t: "I dislike entering a room full of strangers and trying to connect.", need: "F", rev: true },
    { t: "Most evenings, I kick back and relax rather than prepare for the next day’s tasks.", need: "A", rev: true },
    { t: "I prefer to take charge when working with others.", need: "P" },
    { t: "If you met me, you would say that I get on well with other people.", need: "F" },
    { t: "People who work so hard they make the rest of us look bad really bother me.", need: "A", rev: true },
    { t: "More than anything at my job, I want to be respected.", need: "P" },
    { t: "In a tight situation, I like it when I am in charge and the blame or praise will come to me.", need: "P" },
    { t: "Most people who know me say I am ambitious.", need: "A" },
    { t: "I enjoy spending much of my time alone.", need: "F", rev: true },
    { t: "I want to one day have a high status job and make lots of money.", need: "P" },
    { t: "I regularly list my goals where I can see them during the day.", need: "A" },
    { t: "In fantasies about my career, often I am in a group and they are praising me.", need: "F" },
    { t: "If I knew others disapproved of my actions, it would cause me to rethink my plans.", need: "F" }
  ];
  var NEEDS = [
    { key: "A", name: "Achievement" },
    { key: "P", name: "Power" },
    { key: "F", name: "Affiliation" }
  ];

  var answers = new Array(ITEMS.length).fill(null);
  var idx = 0;
  var locked = false;

  var $ = function (id) { return document.getElementById(id); };

  function show(id) {
    document.querySelectorAll(".screen").forEach(function (s) { s.classList.remove("active"); });
    $(id).classList.add("active");
  }

  // Build the 1-5 buttons once
  for (var v = 1; v <= 5; v++) {
    var b = document.createElement("button");
    b.className = "opt";
    b.textContent = v;
    b.dataset.v = v;
    b.addEventListener("click", function () { choose(+this.dataset.v); });
    $("scale").appendChild(b);
  }

  function renderItem() {
    $("prompt").textContent = ITEMS[idx].t;
    $("count").textContent = (idx + 1) + " / " + ITEMS.length;
    $("bar").style.width = (idx / ITEMS.length * 100) + "%";
    $("backBtn").hidden = idx === 0;
    document.querySelectorAll(".opt").forEach(function (o) {
      o.classList.toggle("chosen", +o.dataset.v === answers[idx]);
    });
    show("item");
  }

  function choose(v) {
    if (locked) return;
    locked = true;
    answers[idx] = v;
    document.querySelectorAll(".opt").forEach(function (o) {
      o.classList.toggle("chosen", +o.dataset.v === v);
    });
    $("bar").style.width = ((idx + 1) / ITEMS.length * 100) + "%";
    setTimeout(function () {
      locked = false;
      if (idx < ITEMS.length - 1) { idx++; renderItem(); }
      else { renderResults(); }
    }, 220);
  }

  // Each need: 5 items x 1-5 = 5-25, mapped linearly to 1-10 and rounded.
  function scores() {
    var sums = { A: 0, P: 0, F: 0 };
    ITEMS.forEach(function (it, i) {
      sums[it.need] += it.rev ? 6 - answers[i] : answers[i];
    });
    var out = {};
    NEEDS.forEach(function (n) {
      out[n.key] = Math.round(1 + (sums[n.key] - 5) * 9 / 20);
    });
    return out;
  }

  function renderResults() {
    var s = scores();
    $("scores").innerHTML = NEEDS.map(function (n) {
      return '<div class="score"><span class="name">' + n.name + '</span>' +
             '<span class="val">' + s[n.key] + ' <small>/ 10</small></span></div>';
    }).join("");
    $("chart").innerHTML = radar(s);
    show("results");
  }

  // Triangle radar: Achievement top, Power lower-right, Affiliation lower-left.
  function radar(s) {
    var cx = 180, cy = 170, R = 125;
    var ang = [-90, 30, 150].map(function (d) { return d * Math.PI / 180; });
    function pt(i, v) {
      var r = v / 10 * R;
      return [cx + r * Math.cos(ang[i]), cy + r * Math.sin(ang[i])];
    }
    function poly(vals) {
      return vals.map(function (v, i) { return pt(i, v).map(function (n) { return n.toFixed(1); }).join(","); }).join(" ");
    }
    var svg = '<svg viewBox="0 20 360 250" role="img" aria-label="Needs profile: ' +
      NEEDS.map(function (n) { return n.name + " " + s[n.key]; }).join(", ") + '">';
    [2, 4, 6, 8, 10].forEach(function (g) {
      svg += '<polygon class="ring' + (g === 10 ? ' outer' : '') + '" points="' + poly([g, g, g]) + '"/>';
    });
    for (var i = 0; i < 3; i++) {
      var e = pt(i, 10);
      svg += '<line class="spoke" x1="' + cx + '" y1="' + cy + '" x2="' + e[0].toFixed(1) + '" y2="' + e[1].toFixed(1) + '"/>';
    }
    var vals = NEEDS.map(function (n) { return s[n.key]; });
    svg += '<g class="grow"><polygon class="shape" points="' + poly(vals) + '"/>';
    vals.forEach(function (v, i) {
      var p = pt(i, v);
      svg += '<circle class="dot" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="6"><title>' +
             NEEDS[i].name + ": " + v + '</title></circle>';
    });
    svg += '</g>';
    // Axis labels
    var top = pt(0, 10), br = pt(1, 10), bl = pt(2, 10);
    svg += '<text class="ax-label" x="' + top[0] + '" y="' + (top[1] - 14) + '" text-anchor="middle">Achievement</text>';
    svg += '<text class="ax-label" x="' + br[0] + '" y="' + (br[1] + 28) + '" text-anchor="middle">Power</text>';
    svg += '<text class="ax-label" x="' + bl[0] + '" y="' + (bl[1] + 28) + '" text-anchor="middle">Affiliation</text>';
    return svg + '</svg>';
  }

  $("startBtn").addEventListener("click", function () { idx = 0; renderItem(); });
  $("backBtn").addEventListener("click", function () { if (idx > 0 && !locked) { idx--; renderItem(); } });
  $("retakeBtn").addEventListener("click", function () {
    answers.fill(null); idx = 0; show("start");
  });

  // Keyboard: 1-5 to answer, Backspace / left arrow to go back
  document.addEventListener("keydown", function (e) {
    if (!$("item").classList.contains("active")) return;
    if (e.key >= "1" && e.key <= "5") choose(+e.key);
    else if ((e.key === "Backspace" || e.key === "ArrowLeft") && idx > 0 && !locked) { idx--; renderItem(); }
  });

  function fit() {
    var d = document.documentElement;
    var sc = Math.min(d.clientWidth / 720, d.clientHeight / 450);
    $("stage").style.transform = "translate(-50%, -50%) scale(" + sc + ")";
  }
  window.addEventListener("resize", fit);
  fit();
</script>
</body>
</html>
