<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Need for Cognition Scale</title>
<style>
  :root {
    color-scheme: light;
    --page: #eef0f4;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --muted: #52514e;
    --line: rgba(11, 11, 11, 0.12);
    --soft: rgba(11, 11, 11, 0.05);
    --accent: #2a78d6;
    --accent-ink: #ffffff;
    --accent-soft: rgba(42, 120, 214, 0.18);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0f0f0e;
      --surface: #1a1a19;
      --ink: #ffffff;
      --muted: #c3c2b7;
      --line: rgba(255, 255, 255, 0.14);
      --soft: rgba(255, 255, 255, 0.06);
      --accent: #3987e5;
      --accent-soft: rgba(57, 135, 229, 0.28);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0f0f0e;
    --surface: #1a1a19;
    --ink: #ffffff;
    --muted: #c3c2b7;
    --line: rgba(255, 255, 255, 0.14);
    --soft: rgba(255, 255, 255, 0.06);
    --accent: #3987e5;
    --accent-soft: rgba(57, 135, 229, 0.28);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--page);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* Fixed 720x450 stage, scaled to fit whatever frame it's placed in */
  #stage {
    position: absolute;
    left: 50%; top: 50%;
    width: 720px; height: 450px;
    transform-origin: center center;
    background: var(--surface);
    overflow: hidden;
  }

  .screen {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    padding: 28px 40px;
  }
  .screen.active { display: flex; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; touch-action: manipulation; }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

  .primary {
    background: var(--accent); color: var(--accent-ink);
    font-size: 26px; font-weight: 600;
    min-width: 240px; height: 76px; border-radius: 16px;
    transition: transform .1s ease, filter .15s ease;
  }
  .primary:hover { filter: brightness(1.08); }
  .primary:active { transform: scale(.97); }

  /* Start */
  #start { align-items: center; justify-content: center; gap: 18px; text-align: center; }
  #start h1 { font-size: 44px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
  #start p { font-size: 20px; color: var(--muted); margin-bottom: 22px; }

  /* Items */
  #item { padding-top: 20px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; height: 48px; }
  .back {
    height: 48px; padding: 0 18px 0 12px; border-radius: 12px;
    font-size: 18px; color: var(--muted);
    display: flex; align-items: center; gap: 6px;
  }
  .back:hover { background: var(--soft); }
  .back[hidden] { visibility: hidden; display: flex; }
  .count { font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .progress { height: 6px; border-radius: 3px; background: var(--soft); margin-top: 10px; overflow: hidden; }
  .progress div { height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .3s ease; }

  .prompt {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    font-size: 28px; line-height: 1.3; font-weight: 500;
    padding: 0 10px;
    text-wrap: balance;
  }

  .scale { display: flex; justify-content: center; gap: 14px; }
  .opt {
    width: 112px; height: 96px; border-radius: 18px;
    border: 2px solid var(--line);
    background: var(--surface);
    font-size: 36px; font-weight: 600;
    font-variant-numeric: tabular-nums;
    transition: background .12s ease, border-color .12s ease, transform .1s ease;
  }
  .opt:hover { border-color: var(--accent); background: var(--accent-soft); }
  .opt:active { transform: scale(.95); }
  .opt.chosen { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .anchors {
    display: flex; justify-content: space-between;
    width: 616px; margin: 10px auto 0;
    font-size: 17px; color: var(--muted);
  }

  /* Results */
  #results { padding: 26px 40px 24px; align-items: center; text-align: center; }
  #results h2 { font-size: 26px; font-weight: 600; color: var(--muted); letter-spacing: 0.02em; }
  .level { font-size: 52px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; margin-top: 2px; }
  .total { font-size: 20px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 6px; }

  .gauge { width: 600px; margin: 18px auto 0; }
  .gauge .track { display: flex; height: 26px; border-radius: 13px; overflow: hidden; background: var(--soft); }
  .gauge .band { height: 100%; background: var(--accent); }
  .gauge .band.b1 { opacity: 0.22; }
  .gauge .band.b2 { opacity: 0.48; }
  .gauge .band.b3 { opacity: 0.85; }
  .gauge .rail { position: relative; height: 0; }
  .gauge .pin {
    position: absolute; top: -34px; transform: translateX(-50%);
    width: 4px; height: 42px; border-radius: 2px;
    background: var(--ink); box-shadow: 0 0 0 3px var(--surface);
    transition: left .5s cubic-bezier(.2,.8,.2,1);
  }
  .gauge .labels {
    display: flex; margin-top: 10px;
    font-size: 16px; color: var(--muted);
  }
  .gauge .labels span { text-align: center; }
  .gauge .labels b { display: block; color: var(--ink); font-weight: 600; font-size: 17px; }

  .blurb {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 19px; line-height: 1.4; color: var(--muted);
    max-width: 610px; text-wrap: balance;
  }
  .res-foot .primary { height: 54px; font-size: 21px; min-width: 190px; }

  @media (prefers-reduced-motion: reduce) {
    .screen.active { animation: none; }
    .gauge .pin { transition: none; }
  }
</style>
</head>
<body>
<div id="stage">

  <section id="start" class="screen active">
    <h1>Need for Cognition Scale</h1>
    <p>6 items &middot; rate each 1&ndash;5</p>
    <button class="primary" id="startBtn">Start</button>
  </section>

  <section id="item" class="screen">
    <div class="topbar">
      <button class="back" id="backBtn" aria-label="Previous item">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Back
      </button>
      <span class="count" id="count">1 / 6</span>
    </div>
    <div class="progress"><div id="bar"></div></div>
    <p class="prompt" id="prompt" aria-live="polite"></p>
    <div class="scale" id="scale" role="group" aria-label="Rating from 1 (very unlike me) to 5 (very like me)"></div>
    <div class="anchors"><span>Very unlike me</span><span>Very like me</span></div>
  </section>

  <section id="results" class="screen">
    <h2>Your need for cognition is</h2>
    <div class="level" id="levelName">Moderate</div>
    <div class="total" id="totalLine">18 out of 30</div>
    <div class="gauge">
      <div class="track">
        <div class="band b1" style="width:47.9%"></div>
        <div class="band b2" style="width:25%"></div>
        <div class="band b3" style="width:27.1%"></div>
      </div>
      <div class="rail"><div class="pin" id="pin" style="left:50%"></div></div>
      <div class="labels">
        <span style="width:47.9%"><b>Low</b>6 to 17</span>
        <span style="width:25%"><b>Moderate</b>18 to 23</span>
        <span style="width:27.1%"><b>High</b>24 to 30</span>
      </div>
    </div>
    <p class="blurb" id="blurb"></p>
    <div class="res-foot"><button class="primary" id="retakeBtn">Retake</button></div>
  </section>

</div>

<script>
  // Cacioppo & Petty's Need for Cognition Scale (short form). rev = reverse-scored.
  var ITEMS = [
    { t: "I would prefer complex to simple problems." },
    { t: "I like to have the responsibility of handling a situation that requires a lot of thinking." },
    { t: "Thinking is not my idea of fun.", rev: true },
    { t: "I would rather do something that requires little thought than something that is sure to challenge my thinking abilities.", rev: true },
    { t: "I really enjoy a task that involves coming up with new solutions to problems." },
    { t: "I would prefer a task that is intellectual, difficult, and important to one that is somewhat important but does not require much thought." }
  ];

  var LEVELS = [
    { name: "Low", max: 17, blurb: "You tend to save your mental energy for what matters and lean on shortcuts, habits and other people's judgments for the rest. That keeps decisions quick, but it also means persuasive packaging can carry more weight with you than the argument inside it." },
    { name: "Moderate", max: 23, blurb: "You enjoy a good mental challenge when it is worth the effort, but you are happy to coast on the easy stuff. How carefully you think a problem through depends a lot on how much you care about the outcome." },
    { name: "High", max: 30, blurb: "You seek out thinking for its own sake and enjoy wrestling with hard, ambiguous problems. You are more likely to be persuaded by the quality of an argument than by who is making it or how slickly it is presented." }
  ];

  var MIN = ITEMS.length;          // 6
  var MAX = ITEMS.length * 5;      // 30

  var answers = new Array(ITEMS.length).fill(null);
  var idx = 0;
  var locked = false;

  var $ = function (id) { return document.getElementById(id); };

  function show(id) {
    document.querySelectorAll(".screen").forEach(function (s) { s.classList.remove("active"); });
    $(id).classList.add("active");
  }

  // Build the 1-5 buttons once
  for (var v = 1; v <= 5; v++) {
    var b = document.createElement("button");
    b.className = "opt";
    b.textContent = v;
    b.dataset.v = v;
    b.addEventListener("click", function () { choose(+this.dataset.v); });
    $("scale").appendChild(b);
  }

  function renderItem() {
    $("prompt").textContent = ITEMS[idx].t;
    $("count").textContent = (idx + 1) + " / " + ITEMS.length;
    $("bar").style.width = (idx / ITEMS.length * 100) + "%";
    $("backBtn").hidden = idx === 0;
    document.querySelectorAll(".opt").forEach(function (o) {
      o.classList.toggle("chosen", +o.dataset.v === answers[idx]);
    });
    show("item");
  }

  function choose(v) {
    if (locked) return;
    locked = true;
    answers[idx] = v;
    document.querySelectorAll(".opt").forEach(function (o) {
      o.classList.toggle("chosen", +o.dataset.v === v);
    });
    $("bar").style.width = ((idx + 1) / ITEMS.length * 100) + "%";
    setTimeout(function () {
      locked = false;
      if (idx < ITEMS.length - 1) { idx++; renderItem(); }
      else { renderResults(); }
    }, 220);
  }

  // Items 3 and 4 are reverse scored, so every item ends up pointing the same way.
  function total() {
    return ITEMS.reduce(function (sum, it, i) {
      return sum + (it.rev ? 6 - answers[i] : answers[i]);
    }, 0);
  }

  function renderResults() {
    var t = total();
    var lvl = LEVELS.find(function (l) { return t <= l.max; });
    $("levelName").textContent = lvl.name;
    $("totalLine").textContent = t + " out of " + MAX;
    $("blurb").textContent = lvl.blurb;
    show("results");
    // Nudge the pin after paint so it animates into place.
    $("pin").style.left = "50%";
    requestAnimationFrame(function () {
      $("pin").style.left = ((t - MIN) / (MAX - MIN) * 100).toFixed(1) + "%";
    });
  }

  $("startBtn").addEventListener("click", function () { idx = 0; renderItem(); });
  $("backBtn").addEventListener("click", function () { if (idx > 0 && !locked) { idx--; renderItem(); } });
  $("retakeBtn").addEventListener("click", function () {
    answers.fill(null); idx = 0; show("start");
  });

  // Keyboard: 1-5 to answer, Backspace / left arrow to go back
  document.addEventListener("keydown", function (e) {
    if (!$("item").classList.contains("active")) return;
    if (e.key >= "1" && e.key <= "5") choose(+e.key);
    else if ((e.key === "Backspace" || e.key === "ArrowLeft") && idx > 0 && !locked) { idx--; renderItem(); }
  });

  function fit() {
    var d = document.documentElement;
    var sc = Math.min(d.clientWidth / 720, d.clientHeight / 450);
    $("stage").style.transform = "translate(-50%, -50%) scale(" + sc + ")";
  }
  window.addEventListener("resize", fit);
  fit();
</script>
</body>
</html>
